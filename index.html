<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Babel Room - 실시간 다국어 번역 채팅</title>

  <!-- 전체화면 앱(PWA) 모드 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="data:application/manifest+json;utf-8,%7B%22name%22%3A%22Babel%20Room%22%2C%22short_name%22%3A%22Babel%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D" />

  <script>
    (function() {
      var userAgent = navigator.userAgent.toLowerCase();
      var targetUrl = location.href;
      if (userAgent.indexOf('kakaotalk') > -1) {
        if (userAgent.indexOf('android') > -1) {
          location.href = 'intent://' + location.href.replace(/https?:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        } else if (userAgent.indexOf('iphone') > -1 || userAgent.indexOf('ipad') > -1 || userAgent.indexOf('ipod') > -1) {
          location.href = 'kakaoweb://openExternal?url=' + encodeURIComponent(targetUrl);
        }
      }
    })();
  </script>
  


  <!-- Socket.io 및 실시간 QR코드 생성 라이브러리 -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    html, body { 
      height: 100%; 
      margin: 0; 
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #14181F; color: #EDEAE3; }
    input, select, button { font-family: inherit; }

    .screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { width: 100%; max-width: 400px; background: #1E2530; border-radius: 16px; padding: 28px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand-title { font-size: 24px; color: #EDEAE3; font-weight: 600; }
    .sub { color: #8A93A3; font-size: 13px; margin: 0 0 20px 0; }
    label { color: #8A93A3; font-size: 12px; display: block; margin-bottom: 6px; }
    .field { margin-bottom: 16px; }
    .input-row { display: flex; gap: 8px; }
    input[type=text], select {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #333B49;
      background: #14181F; color: #EDEAE3; font-size: 14px; outline: none;
    }
    input[type=text]:focus, select:focus { border-color: #3FA9A0; }
    .gen-btn {
      padding: 0 12px; border-radius: 8px; border: 1px solid #3FA9A0;
      background: rgba(63, 169, 160, 0.1); color: #3FA9A0; font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .join-btn {
      width: 100%; padding: 13px; border-radius: 8px; border: none;
      background: #3FA9A0; color: #0E1116; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 6px;
    }
    .join-btn:disabled { background: #555; color: #888; cursor: not-allowed; }

    .fav-wrap { margin-top: 20px; border-top: 1px solid #2A313D; padding-top: 16px; }
    .fav-title { font-size: 12px; color: #8A93A3; margin-bottom: 8px; }
    .fav-list { display: flex; flex-direction: column; gap: 6px; max-height: 120px; overflow-y: auto; }
    .fav-item { display: flex; justify-content: space-between; align-items: center; background: #14181F; padding: 8px 12px; border-radius: 6px; font-size: 13px; border: 1px solid #2A313D; }
    .fav-code { font-weight: bold; color: #3FA9A0; cursor: pointer; }
    .fav-del { color: #E05252; cursor: pointer; font-size: 12px; }

    #chat-screen { display: none; flex-direction: column; height: 100vh; max-width: 600px; margin: 0 auto; background: #1E2530; position: relative; }
    .chat-header {
      padding: 10px 14px; background: #14181F; border-bottom: 1px solid #2A313D;
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
    }
    .room-info { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .room-badge { background: #2A313D; padding: 4px 6px; border-radius: 6px; font-size: 12px; font-weight: bold; color: #3FA9A0; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #E05252; }
    .status-dot.online { background: #3FA9A0; }
    
    .icon-btn { background: #2A313D; border: 1px solid #333B49; color: #EDEAE3; border-radius: 6px; padding: 5px 8px; font-size: 11px; cursor: pointer; }
    .icon-btn.active { background: rgba(63, 169, 160, 0.25); border-color: #3FA9A0; color: #3FA9A0; }
    .exit-btn { background: rgba(224, 82, 82, 0.15); border-color: #E05252; color: #E05252; }
    
    /* 상용구 프리셋 바 */
    .preset-bar {
      display: flex; gap: 6px; overflow-x: auto; padding: 6px 14px; background: #181E27; border-bottom: 1px solid #2A313D;
      white-space: nowrap; -webkit-overflow-scrolling: touch;
    }
    .preset-chip {
      background: #252D3A; border: 1px solid #333B49; color: #B0B8C4;
      font-size: 11px; padding: 4px 10px; border-radius: 14px; cursor: pointer;
    }
    .preset-chip:active { background: #3FA9A0; color: #0E1116; }

    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg-wrap { display: flex; flex-direction: column; max-width: 82%; }
    .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
    .msg-wrap.theirs { align-self: flex-start; align-items: flex-start; }
    
    .msg-meta { font-size: 11px; color: #8A93A3; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
    .msg-box { padding: 10px 14px; border-radius: 12px; position: relative; word-break: break-word; }
    .msg-wrap.mine .msg-box { background: #3FA9A0; color: #0E1116; border-bottom-right-radius: 2px; }
    .msg-wrap.theirs .msg-box { background: #2A313D; color: #EDEAE3; border-bottom-left-radius: 2px; }
    
    .translated-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; font-size: 14px; font-weight: 500; }
    .original-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; font-size: 11px; margin-top: 6px; opacity: 0.8; border-top: 1px dashed rgba(255,255,255,0.25); padding-top: 4px; }
    .tts-btn { cursor: pointer; font-size: 13px; opacity: 0.85; flex-shrink: 0; padding: 0 2px; }
    
    /* 하단 입력 영역 & 번역 미리보기 */
    .input-section { background: #14181F; border-top: 1px solid #2A313D; }
    .preview-box {
      padding: 4px 16px; font-size: 11px; color: #3FA9A0; min-height: 18px;
      display: none; background: #1A212C; border-bottom: 1px dashed #2A313D;
    }
    .chat-input-area { padding: 8px 14px 12px 14px; display: flex; gap: 8px; align-items: center; }
    .input-wrapper { position: relative; flex: 1; display: flex; align-items: center; }
    .input-wrapper input { width: 100%; padding-right: 36px; }
    
    .mic-btn {
      position: absolute; right: 8px; background: transparent; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      padding: 4px; border-radius: 50%; color: #8A93A3; transition: all 0.2s;
    }
    .mic-btn:hover { color: #3FA9A0; }
    .mic-btn.recording { color: #E05252; animation: pulse 1.2s infinite; }
    @keyframes pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px #E05252); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 6px #E05252); }
      100% { transform: scale(1); filter: drop-shadow(0 0 2px #E05252); }
    }

    .send-btn { background: #3FA9A0; border: none; color: #0E1116; font-weight: bold; padding: 10px 16px; border-radius: 8px; cursor: pointer; flex-shrink: 0; }

    /* QR 코드 모달 창 */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); z-index: 1000; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-card {
      background: #1E2530; padding: 24px; border-radius: 16px; text-align: center;
      max-width: 320px; width: 100%; border: 1px solid #333B49;
    }
    .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; color: #EDEAE3; }
    .modal-sub { font-size: 12px; color: #8A93A3; margin-bottom: 16px; }
    #qrcode { display: flex; justify-content: center; margin: 12px 0; padding: 10px; background: #fff; border-radius: 8px; }
    .modal-close {
      margin-top: 14px; width: 100%; padding: 10px; background: #2A313D;
      border: 1px solid #333B49; color: #EDEAE3; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="lobby-screen" class="screen">
    <div class="card">
      <div class="brand">
        <div class="brand-title">Babel Room</div>
      </div>
      <div class="sub">국경 없는 실시간 번역 대화방</div>

      <div class="field">
        <label>대화방 코드</label>
        <div class="input-row">
          <input type="text" id="roomInput" placeholder="ROOM-0000" />
          <button class="gen-btn" onclick="generateRoomCode()">새 방 생성</button>
        </div>
      </div>

      <div class="field">
        <label>내 닉네임</label>
        <input type="text" id="nameInput" placeholder="이름 또는 고유 닉네임" />
      </div>

      <div class="field">
        <label>내가 사용할 언어</label>
        <select id="langSelect">
          <option value="ko">한국어 (Korean)</option>
          <option value="en">English (영어)</option>
          <option value="ja">日本語 (일본어)</option>
          <option value="zh-CN">中文 (중국어)</option>
          <option value="es">Español (스페인어)</option>
          <option value="vi">Tiếng Việt (베트남어)</option>
          <option value="th">ไทย (태국어)</option>
          <option value="de">Deutsch (독일어)</option>
          <option value="fr">Français (프랑스어)</option>
          <option value="ar">العربية (아랍어)</option>
        </select>
      </div>

      <button class="join-btn" id="joinBtn" onclick="joinRoom()">입장하기</button>

      <div class="fav-wrap">
        <div class="fav-title">최근 / 즐겨찾기 방 목록</div>
        <div id="favList" class="fav-list"></div>
      </div>
    </div>
  </div>

  <div id="chat-screen">
    <div class="chat-header">
      <div class="room-info">
        <span class="status-dot" id="statusDot" title="서버 연결 상태"></span>
        <span class="room-badge" id="displayRoomCode">ROOM-0000</span>
        <button class="icon-btn" onclick="openQRModal()">QR보기</button>
        <button class="icon-btn" id="autoTtsBtn" onclick="toggleAutoTTS()">자동음성: OFF</button>
        <button class="icon-btn" onclick="copyInviteLink()">초대링크</button>
        <button class="icon-btn" onclick="downloadChatLog()">대화저장</button>
      </div>
      <div>
        <button class="icon-btn exit-btn" onclick="leaveRoom()">나가기</button>
      </div>
    </div>

    <!-- 빠른 응답 프리셋 칩 -->
    <div class="preset-bar">
      <div class="preset-chip" onclick="sendPreset('안녕하세요! 반갑습니다.')">👋 인사</div>
      <div class="preset-chip" onclick="sendPreset('네, 알겠습니다.')">👌 확인</div>
      <div class="preset-chip" onclick="sendPreset('목적지에 도착했습니다.')">📍 도착</div>
      <div class="preset-chip" onclick="sendPreset('결제는 카드로 도와드리겠습니다.')">💳 카드결제</div>
      <div class="preset-chip" onclick="sendPreset('영수증 필요하신가요?')">🧾 영수증</div>
      <div class="preset-chip" onclick="sendPreset('잠시만 기다려 주세요.')">⏳ 대기</div>
      <div class="preset-chip" onclick="sendPreset('감사합니다. 좋은 하루 되세요!')">✨ 감사</div>
    </div>

    <div id="messages" class="chat-messages"></div>

    <div class="input-section">
      <div id="previewBox" class="preview-box"></div>
      <form class="chat-input-area" onsubmit="handleSendForm(event)">
        <div class="input-wrapper">
          <input type="text" id="msgInput" placeholder="메시지를 입력하거나 마이크를 누르세요..." autocomplete="off" oninput="handlePreview(this.value)" />
          <button type="button" class="mic-btn" id="micBtn" onclick="toggleSTT()" title="음성 입력 토글">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
        </div>
        <button type="submit" class="send-btn">전송</button>
      </form>
    </div>
  </div>

  <!-- QR 코드 팝업 모달 -->
  <div id="qrModal" class="modal-overlay" onclick="closeQRModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-title">상대방 초대 QR 코드</div>
      <div class="modal-sub">스마트폰 기본 카메라로 비추면 바로 입장합니다.</div>
      <div id="qrcode"></div>
      <div style="font-size: 13px; font-weight: bold; color: #3FA9A0; margin-top: 8px;" id="qrRoomText"></div>
      <button class="modal-close" onclick="closeQRModal()">닫기</button>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://babel-chat-backend.onrender.com";
    let socket = null;
    let currentRoom = "";
    let myName = "";
    let myLang = "ko";
    let chatHistory = [];
    
    let recognition = null;
    let userWantsRecording = false;
    let autoTTS = false;
    let previewTimer = null;
    let qrGenerator = null;

    async function clientTranslate(text, sourceLang, targetLang) {
      if (!text || text.trim() === '') return text;
      if (sourceLang === targetLang) return text;
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang || 'auto'}&tl=${targetLang}&dt=t&dt=bd&dt=qc&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        if (!res.ok) return text;
        const data = await res.json();
        if (data && data[0]) {
          return data[0].map(item => item[0]).filter(Boolean).join('');
        }
        return text;
      } catch (err) {
        return text;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      if (roomParam) document.getElementById('roomInput').value = roomParam;
      
      const savedName = localStorage.getItem('babel_nickname');
      if (savedName) document.getElementById('nameInput').value = savedName;

      const savedLang = localStorage.getItem('babel_lang');
      if (savedLang) {
        document.getElementById('langSelect').value = savedLang;
      } else {
        document.getElementById('langSelect').value = 'ko';
      }

      loadFavorites();

      const activeRoom = sessionStorage.getItem('babel_active_room');
      const activeName = sessionStorage.getItem('babel_active_name');
      const activeLang = sessionStorage.getItem('babel_active_lang');
      if (activeRoom && activeName) {
        document.getElementById('roomInput').value = activeRoom;
        document.getElementById('nameInput').value = activeName;
        if (activeLang) document.getElementById('langSelect').value = activeLang;
        joinRoom();
      }
    });

    window.addEventListener('popstate', () => {
      if (currentRoom) {
        if (confirm("대화방을 나가시겠습니까?")) {
          leaveRoom(false);
        } else {
          history.pushState(null, '', location.href);
        }
      }
    });

    function generateRoomCode() {
      const rand = Math.floor(1000 + Math.random() * 9000);
      document.getElementById('roomInput').value = `ROOM-${rand}`;
    }

    function saveToFavorites(room) {
      let favs = JSON.parse(localStorage.getItem('babel_rooms') || '[]');
      if (!favs.includes(room)) {
        favs.unshift(room);
        if (favs.length > 5) favs.pop();
        localStorage.setItem('babel_rooms', JSON.stringify(favs));
      }
      loadFavorites();
    }

    function loadFavorites() {
      const favList = document.getElementById('favList');
      const favs = JSON.parse(localStorage.getItem('babel_rooms') || '[]');
      favList.innerHTML = "";
      if (favs.length === 0) {
        favList.innerHTML = '<div style="font-size:12px; color:#5A6272;">저장된 방이 없습니다.</div>';
        return;
      }
      favs.forEach(room => {
        const item = document.createElement('div');
        item.className = 'fav-item';
        item.innerHTML = `
          <span class="fav-code" onclick="selectFav('${room}')">${room}</span>
          <span class="fav-del" onclick="deleteFav('${room}')">삭제</span>
        `;
        favList.appendChild(item);
      });
    }

    function selectFav(room) { document.getElementById('roomInput').value = room; }
    function deleteFav(room) {
      let favs = JSON.parse(localStorage.getItem('babel_rooms') || '[]');
      favs = favs.filter(r => r !== room);
      localStorage.setItem('babel_rooms', JSON.stringify(favs));
      loadFavorites();
    }

    function joinRoom() {
      const r = document.getElementById('roomInput').value.trim().toUpperCase();
      const n = document.getElementById('nameInput').value.trim();
      const l = document.getElementById('langSelect').value;

      if (!r) { alert("방 코드를 입력해주세요."); return; }
      if (!n) { alert("닉네임을 입력해주세요."); return; }

      currentRoom = r;
      myName = n;
      myLang = l;

      localStorage.setItem('babel_nickname', myName);
      localStorage.setItem('babel_lang', myLang);
      
      sessionStorage.setItem('babel_active_room', currentRoom);
      sessionStorage.setItem('babel_active_name', myName);
      sessionStorage.setItem('babel_active_lang', myLang);
      saveToFavorites(currentRoom);

      const joinBtn = document.getElementById('joinBtn');
      joinBtn.innerText = "서버 연결 중...";
      joinBtn.disabled = true;

      socket = io(BACKEND_URL, { 
        transports: ["websocket", "polling"],
        timeout: 45000,
        reconnection: true,
        reconnectionAttempts: 15,
        reconnectionDelay: 1000
      });

      socket.on("connect", () => {
        document.getElementById('statusDot').className = "status-dot online";
        joinBtn.innerText = "입장하기";
        joinBtn.disabled = false;
        
        socket.emit("join_room", { room: currentRoom, name: myName });
        document.getElementById('displayRoomCode').innerText = currentRoom;
        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';

        history.pushState(null, '', location.href);
      });

      socket.on("disconnect", () => {
        const dot = document.getElementById('statusDot');
        if (dot) dot.className = "status-dot";
      });

      socket.on("receive_message", async (data) => {
        await processAndDisplayMessage(data);
      });

      socket.on("connect_error", () => {
        const dot = document.getElementById('statusDot');
        if (dot) dot.className = "status-dot";
      });
    }

    function handleSendForm(e) {
      e.preventDefault();
      if (userWantsRecording) toggleSTT();
      sendMessage();
    }

    function sendMessage(customText = null) {
      const input = document.getElementById('msgInput');
      const text = customText || input.value.trim();
      
      if (!text) return;

      if (!socket || !socket.connected) {
        alert("서버 연결이 원활하지 않습니다. 초록불(🟢)을 확인해 주세요.");
        return;
      }

      socket.emit("send_message", {
        room: currentRoom,
        sender_name: myName,
        sender_lang: myLang,
        text: text
      });
      
      if (!customText) {
        input.value = "";
        document.getElementById('previewBox').style.display = 'none';
        input.focus();
      }
    }

    function sendPreset(text) {
      sendMessage(text);
    }

    // 전송 전 영문 번역 실시간 미리보기 (디바운스 처리)
    function handlePreview(val) {
      const previewBox = document.getElementById('previewBox');
      clearTimeout(previewTimer);

      if (!val || val.trim().length === 0 || myLang !== 'ko') {
        previewBox.style.display = 'none';
        return;
      }

      previewTimer = setTimeout(async () => {
        const translated = await clientTranslate(val, 'ko', 'en');
        if (translated && translated !== val) {
          previewBox.innerText = `🔍 예상 번역(EN): ${translated}`;
          previewBox.style.display = 'block';
        } else {
          previewBox.style.display = 'none';
        }
      }, 350);
    }

    async function processAndDisplayMessage(data) {
      const msgs = document.getElementById('messages');
      const isMine = data.sender_name === myName;
      
      let displayText = data.original_text;

      if (data.sender_lang !== myLang) {
        displayText = await clientTranslate(data.original_text, data.sender_lang, myLang);
      }

      const originalText = data.original_text;
      const timeStr = new Date(data.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      chatHistory.push(`[${timeStr}] ${data.sender_name}: ${displayText}${displayText !== originalText ? ` (원문: ${originalText})` : ''}`);

      const wrap = document.createElement('div');
      wrap.className = `msg-wrap ${isMine ? 'mine' : 'theirs'}`;

      let contentHtml = `
        <div class="translated-row">
          <span>${displayText}</span>
          <span class="tts-btn" onclick="playTTS('${displayText.replace(/'/g, "\\'")}', '${myLang}')">🔊</span>
        </div>
      `;

      if (displayText !== originalText) {
        contentHtml += `
          <div class="original-row">
            <span>${originalText}</span>
            <span class="tts-btn" onclick="playTTS('${originalText.replace(/'/g, "\\'")}', '${data.sender_lang}')">🔊</span>
          </div>
        `;
      }

      wrap.innerHTML = `
        <div class="msg-meta">
          <span>${data.sender_name} (${timeStr})</span>
        </div>
        <div class="msg-box">
          ${contentHtml}
        </div>
      `;
      msgs.appendChild(wrap);
      msgs.scrollTop = msgs.scrollHeight;

      // 자동 읽기(Auto-TTS) 활성화 상태이고 상대방 메시지인 경우 자동 음성 출력
      if (autoTTS && !isMine) {
        playTTS(displayText, myLang);
      }
    }

    function toggleAutoTTS() {
      autoTTS = !autoTTS;
      const btn = document.getElementById('autoTtsBtn');
      if (autoTTS) {
        btn.innerText = "자동음성: ON";
        btn.classList.add('active');
      } else {
        btn.innerText = "자동음성: OFF";
        btn.classList.remove('active');
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    function toggleSTT() {
      const micBtn = document.getElementById('micBtn');
      const input = document.getElementById('msgInput');

      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("현재 브라우저는 음성 입력을 지원하지 않습니다. Chrome 또는 Safari를 사용해 주세요.");
        return;
      }

      if (userWantsRecording) {
        userWantsRecording = false;
        micBtn.classList.remove('recording');
        if (recognition) recognition.stop();
        return;
      }

      userWantsRecording = true;
      micBtn.classList.add('recording');

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();

      const langMap = {
        'ko': 'ko-KR', 'en': 'en-US', 'ja': 'ja-JP', 'zh-CN': 'zh-CN',
        'es': 'es-ES', 'fr': 'fr-FR', 'de': 'de-DE', 'vi': 'vi-VN',
        'th': 'th-TH', 'ar': 'ar-SA'
      };

      recognition.lang = langMap[myLang] || 'ko-KR';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            const transcript = event.results[i][0].transcript.trim();
            if (transcript) {
              insertTextAtCursor(input, transcript + " ");
              handlePreview(input.value);
            }
          }
        }
      };

      recognition.onerror = (event) => {
        console.warn("STT Error:", event.error);
      };

      recognition.onend = () => {
        if (userWantsRecording) {
          try {
            recognition.start();
          } catch (e) {}
        } else {
          micBtn.classList.remove('recording');
        }
      };

      try {
        recognition.start();
      } catch (e) {
        console.error("STT Start Error:", e);
      }
    }

    function insertTextAtCursor(input, textToInsert) {
      const start = input.selectionStart !== null ? input.selectionStart : input.value.length;
      const end = input.selectionEnd !== null ? input.selectionEnd : input.value.length;
      const original = input.value;

      input.value = original.substring(0, start) + textToInsert + original.substring(end);
      const newPos = start + textToInsert.length;
      input.setSelectionRange(newPos, newPos);
      input.focus();
    }

    // QR 모달 열기 및 즉석 생성
    function openQRModal() {
      const modal = document.getElementById('qrModal');
      const qrContainer = document.getElementById('qrcode');
      const qrText = document.getElementById('qrRoomText');
      const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoom}`;

      qrContainer.innerHTML = "";
      qrGenerator = new QRCode(qrContainer, {
        text: inviteUrl,
        width: 180,
        height: 180,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      qrText.innerText = currentRoom;
      modal.style.display = 'flex';
    }

    function closeQRModal(e) {
      document.getElementById('qrModal').style.display = 'none';
    }

    function downloadChatLog() {
      if (chatHistory.length === 0) {
        alert("저장할 대화 내용이 없습니다.");
        return;
      }
      const title = `[Babel-Room] ${currentRoom} 대화기록\n일시: ${new Date().toLocaleString()}\n----------------------------------------\n\n`;
      const blob = new Blob([title + chatHistory.join('\n')], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `대화기록_${currentRoom}_${Date.now()}.txt`;
      a.click();
    }

    function playTTS(text, langCode) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const langMap = {
        'ko': 'ko-KR', 'en': 'en-US', 'ja': 'ja-JP', 'zh-CN': 'zh-CN',
        'es': 'es-ES', 'fr': 'fr-FR', 'de': 'de-DE', 'vi': 'vi-VN',
        'th': 'th-TH', 'ar': 'ar-SA'
      };

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = langMap[langCode] || langCode;
      utter.rate = 0.95;
      window.speechSynthesis.speak(utter);
    }

    function copyInviteLink() {
      const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoom}`;
      navigator.clipboard.writeText(inviteUrl).then(() => alert("초대 링크가 복사되었습니다:\n" + inviteUrl));
    }

    function leaveRoom(manual = true) {
      if (!manual || confirm("대화방을 나가시겠습니까?")) {
        userWantsRecording = false;
        if (recognition) recognition.stop();
        sessionStorage.removeItem('babel_active_room');
        sessionStorage.removeItem('babel_active_name');
        sessionStorage.removeItem('babel_active_lang');
        if (socket) {
          socket.emit("leave_room", { room: currentRoom });
          socket.disconnect();
        }
        location.reload();
      }
    }
  </script>
</body>
</html>
