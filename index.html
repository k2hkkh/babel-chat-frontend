<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Babel Room - 실시간 다국어 번역 채팅</title>
  
  <script>
    (function() {
      var userAgent = navigator.userAgent.toLowerCase();
      var targetUrl = location.href;
      if (userAgent.indexOf('kakaotalk') > -1) {
        if (userAgent.indexOf('android') > -1) {
          location.href = 'intent://' + location.href.replace(/https?:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        } else if (userAgent.indexOf('iphone') > -1 || userAgent.indexOf('ipad') > -1 || userAgent.indexOf('ipod') > -1) {
          location.href = 'kakaoweb://openExternal?url=' + encodeURIComponent(targetUrl);
        }
      }
    })();
  </script>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    html, body { 
      height: 100%; 
      margin: 0; 
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #14181F; color: #EDEAE3; }
    input, select, button { font-family: inherit; }

    .screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { width: 100%; max-width: 400px; background: #1E2530; border-radius: 16px; padding: 28px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand-title { font-size: 24px; color: #EDEAE3; font-weight: 600; }
    .sub { color: #8A93A3; font-size: 13px; margin: 0 0 20px 0; }
    label { color: #8A93A3; font-size: 12px; display: block; margin-bottom: 6px; }
    .field { margin-bottom: 16px; }
    .input-row { display: flex; gap: 8px; }
    input[type=text], select {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #333B49;
      background: #14181F; color: #EDEAE3; font-size: 14px; outline: none;
    }
    input[type=text]:focus, select:focus { border-color: #3FA9A0; }
    .gen-btn {
      padding: 0 12px; border-radius: 8px; border: 1px solid #3FA9A0;
      background: rgba(63, 169, 160, 0.1); color: #3FA9A0; font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .join-btn {
      width: 100%; padding: 13px; border-radius: 8px; border: none;
      background: #3FA9A0; color: #0E1116; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 6px;
    }
    .join-btn:disabled { background: #555; color: #888; cursor: not-allowed; }

    .fav-wrap { margin-top: 20px; border-top: 1px solid #2A313D; padding-top: 16px; }
    .fav-title { font-size: 12px; color: #8A93A3; margin-bottom: 8px; }
    .fav-list { display: flex; flex-direction: column; gap: 6px; max-height: 120px; overflow-y: auto; }
    .fav-item { display: flex; justify-content: space-between; align-items: center; background: #14181F; padding: 8px 12px; border-radius: 6px; font-size: 13px; border: 1px solid #2A313D; }
    .fav-code { font-weight: bold; color: #3FA9A0; cursor: pointer; }
    .fav-del { color: #E05252; cursor: pointer; font-size: 12px; }

    #chat-screen { display: none; flex-direction: column; height: 100vh; max-width: 600px; margin: 0 auto; background: #1E2530; position: relative; }
    .chat-header {
      padding: 10px 14px; background: #14181F; border-bottom: 1px solid #2A313D;
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
    }
    .room-info { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .room-badge { background: #2A313D; padding: 4px 6px; border-radius: 6px; font-size: 12px; font-weight: bold; color: #3FA9A0; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #E05252; }
    .status-dot.online { background: #3FA9A0; }
    
    .icon-btn { background: #2A313D; border: 1px solid #333B49; color: #EDEAE3; border-radius: 6px; padding: 5px 8px; font-size: 11px; cursor: pointer; }
    .exit-btn { background: rgba(224, 82, 82, 0.15); border-color: #E05252; color: #E05252; }
    
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg-wrap { display: flex; flex-direction: column; max-width: 80%; }
    .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
    .msg-wrap.theirs { align-self: flex-start; align-items: flex-start; }
    
    .msg-meta { font-size: 11px; color: #8A93A3; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
    .msg-box { padding: 10px 14px; border-radius: 12px; position: relative; word-break: break-word; }
    .msg-wrap.mine .msg-box { background: #3FA9A0; color: #0E1116; border-bottom-right-radius: 2px; }
    .msg-wrap.theirs .msg-box { background: #2A313D; color: #EDEAE3; border-bottom-left-radius: 2px; }
    
    .translated-text { font-size: 14px; font-weight: 500; }
    .original-text { font-size: 11px; margin-top: 4px; opacity: 0.75; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 3px; }
    .tts-btn { cursor: pointer; margin-left: 4px; font-size: 12px; }
    
    .chat-input-area { padding: 12px 16px; background: #14181F; border-top: 1px solid #2A313D; display: flex; gap: 8px; }
    .chat-input-area input { flex: 1; }
    .send-btn { background: #3FA9A0; border: none; color: #0E1116; font-weight: bold; padding: 0 16px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="lobby-screen" class="screen">
    <div class="card">
      <div class="brand">
        <div class="brand-title">Babel Room</div>
      </div>
      <div class="sub">국경 없는 실시간 번역 대화방</div>

      <div class="field">
        <label>대화방 코드</label>
        <div class="input-row">
          <input type="text" id="roomInput" placeholder="ROOM-0000" />
          <button class="gen-btn" onclick="generateRoomCode()">새 방 생성</button>
        </div>
      </div>

      <div class="field">
        <label>내 닉네임</label>
        <input type="text" id="nameInput" placeholder="이름 또는 고유 닉네임" />
      </div>

      <div class="field">
        <label>내가 사용할 언어</label>
        <select id="langSelect">
          <option value="ko" selected>한국어 (Korean)</option>
          <option value="en">English (영어)</option>
          <option value="ja">日本語 (일본어)</option>
          <option value="zh">中文 (중국어)</option>
          <option value="vi">Tiếng Việt (베트남어)</option>
          <option value="es">Español (스페인어)</option>
        </select>
      </div>

      <button class="join-btn" id="joinBtn" onclick="joinRoom()">입장하기</button>

      <div class="fav-wrap">
        <div class="fav-title">최근 / 즐겨찾기 방 목록</div>
        <div id="favList" class="fav-list"></div>
      </div>
    </div>
  </div>

  <div id="chat-screen">
    <div class="chat-header">
      <div class="room-info">
        <span class="status-dot" id="statusDot" title="서버 연결 상태"></span>
        <span class="room-badge" id="displayRoomCode">ROOM-0000</span>
        <button class="icon-btn" onclick="copyRoomCode()">코드복사</button>
        <button class="icon-btn" onclick="copyInviteLink()">초대링크</button>
        <button class="icon-btn" onclick="downloadChatLog()">대화저장</button>
      </div>
      <div>
        <button class="icon-btn exit-btn" onclick="leaveRoom()">나가기</button>
      </div>
    </div>

    <div id="messages" class="chat-messages"></div>

    <form class="chat-input-area" onsubmit="handleSendForm(event)">
      <input type="text" id="msgInput" placeholder="메시지를 입력하세요..." autocomplete="off" />
      <button type="submit" class="send-btn">전송</button>
    </form>
  </div>

  <script>
    const BACKEND_URL = "https://babel-chat-backend.onrender.com";
    let socket = null;
    let currentRoom = "";
    let myName = "";
    let myLang = "ko";
    let chatHistory = [];

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      if (roomParam) document.getElementById('roomInput').value = roomParam;
      
      const savedName = localStorage.getItem('babel_nickname');
      if (savedName) document.getElementById('nameInput').value = savedName;

      loadFavorites();
    });

    function generateRoomCode() {
      const rand = Math.floor(1000 + Math.random() * 9000);
      document.getElementById('roomInput').value = `ROOM-${rand}`;
    }

    function saveToFavorites(room) {
      let favs = JSON.parse(localStorage.getItem('babel_rooms') || '[]');
      if (!favs.includes(room)) {
        favs.unshift(room);
        if (favs.length > 5) favs.pop();
        localStorage.setItem('babel_rooms', JSON.stringify(favs));
      }
      loadFavorites();
    }

    function loadFavorites() {
      const favList = document.getElementById('favList');
      const favs = JSON.parse(localStorage.getItem('babel_rooms') || '[]');
      favList.innerHTML = "";
      if (favs.length === 0) {
        favList.innerHTML = '<div style="font-size:12px; color:#5A6272;">저장된 방이 없습니다.</div>';
        return;
      }
      favs.forEach(room => {
        const item = document.createElement('div');
        item.className = 'fav-item';
        item.innerHTML = `
          <span class="fav-code" onclick="selectFav('${room}')">${room}</span>
          <span class="fav-del" onclick="deleteFav('${room}')">삭제</span>
        `;
        favList.appendChild(item);
      });
    }

    function selectFav(room) { document.getElementById('roomInput').value = room; }
    function deleteFav(room) {
      let favs = JSON.parse(localStorage.getItem('babel_rooms') || '[]');
      favs = favs.filter(r => r !== room);
      localStorage.setItem('babel_rooms', JSON.stringify(favs));
      loadFavorites();
    }

    function joinRoom() {
      const r = document.getElementById('roomInput').value.trim().toUpperCase();
      const n = document.getElementById('nameInput').value.trim();
      const l = document.getElementById('langSelect').value;

      if (!r) { alert("방 코드를 입력해주세요."); return; }
      if (!n) { alert("닉네임을 입력해주세요."); return; }

      currentRoom = r;
      myName = n;
      myLang = l;
      chatHistory = [];

      localStorage.setItem('babel_nickname', myName);
      saveToFavorites(currentRoom);

      const joinBtn = document.getElementById('joinBtn');
      joinBtn.innerText = "서버 연결 중...";
      joinBtn.disabled = true;

      // 소켓 연결 설정 (WebSocket 우선 사용)
      socket = io(BACKEND_URL, { 
        transports: ["websocket", "polling"],
        timeout: 45000,
        reconnection: true,
        reconnectionAttempts: 15,
        reconnectionDelay: 1000
      });

      socket.on("connect", () => {
        document.getElementById('statusDot').className = "status-dot online";
        joinBtn.innerText = "입장하기";
        joinBtn.disabled = false;
        
        socket.emit("join", { room: currentRoom, name: myName, lang: myLang });
        document.getElementById('displayRoomCode').innerText = currentRoom;
        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
      });

      socket.on("disconnect", () => {
        const dot = document.getElementById('statusDot');
        if (dot) dot.className = "status-dot";
      });

      socket.on("message", (data) => {
        appendMessage(data);
      });

      socket.on("connect_error", () => {
        const dot = document.getElementById('statusDot');
        if (dot) dot.className = "status-dot";
      });
    }

    function handleSendForm(e) {
      e.preventDefault();
      sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      
      if (!text) return;

      if (!socket || !socket.connected) {
        alert("서버 연결이 원활하지 않습니다. 잠시 후 초록불(🟢)이 들어오면 다시 시도해 주세요.");
        return;
      }

      socket.emit("message", {
        room: currentRoom,
        sender: myName,
        text: text,
        lang: myLang
      });
      
      input.value = "";
      input.focus();
    }

    function appendMessage(data) {
      const msgs = document.getElementById('messages');
      const isMine = data.sender === myName;
      
      const displayText = data.translatedText || data.text;
      const targetLang = data.targetLang || myLang;
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      chatHistory.push(`[${timeStr}] ${data.sender}: ${displayText}${data.translatedText && data.translatedText !== data.text ? ` (원문: ${data.text})` : ''}`);

      const wrap = document.createElement('div');
      wrap.className = `msg-wrap ${isMine ? 'mine' : 'theirs'}`;

      wrap.innerHTML = `
        <div class="msg-meta">
          <span>${data.sender} (${timeStr})</span>
          <span class="tts-btn" onclick="playTTS('${displayText.replace(/'/g, "\\'")}', '${targetLang}')">🔊</span>
        </div>
        <div class="msg-box">
          <div class="translated-text">${displayText}</div>
          ${data.translatedText && data.translatedText !== data.text ? `<div class="original-text">${data.text}</div>` : ''}
        </div>
      `;
      msgs.appendChild(wrap);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function downloadChatLog() {
      if (chatHistory.length === 0) {
        alert("저장할 대화 내용이 없습니다.");
        return;
      }
      const title = `[Babel-Room] ${currentRoom} 대화기록\n일시: ${new Date().toLocaleString()}\n----------------------------------------\n\n`;
      const blob = new Blob([title + chatHistory.join('\n')], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `대화기록_${currentRoom}_${Date.now()}.txt`;
      a.click();
    }

    function playTTS(text, lang) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 0.95;
      window.speechSynthesis.speak(utter);
    }

    function copyRoomCode() {
      navigator.clipboard.writeText(currentRoom).then(() => alert("방 코드가 복사되었습니다: " + currentRoom));
    }

    function copyInviteLink() {
      const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoom}`;
      navigator.clipboard.writeText(inviteUrl).then(() => alert("초대 링크가 복사되었습니다:\n" + inviteUrl));
    }

    function leaveRoom() {
      if (confirm("대화방을 나가시겠습니까?")) {
        if (socket) socket.disconnect();
        location.reload();
      }
    }
  </script>
</body>
</html>
